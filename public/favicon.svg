<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- Rounded Base Badge -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="#334155" stroke-width="8" />
  
  <!-- Document & Coin Symbol -->
  <g filter="url(#shadow)">
    <!-- Document Card -->
    <rect x="110" y="100" width="220" height="290" rx="24" fill="#ffffff" opacity="0.95" />
    <rect x="140" y="150" width="120" height="18" rx="9" fill="#0f172a" />
    <rect x="140" y="190" width="160" height="14" rx="7" fill="#64748b" />
    <rect x="140" y="220" width="140" height="14" rx="7" fill="#64748b" />
    <rect x="140" y="250" width="90" height="14" rx="7" fill="#64748b" />
    <rect x="140" y="310" width="160" height="24" rx="12" fill="#10b981" />

    <!-- Overlapping Emerald Coin Badge -->
    <circle cx="340" cy="330" r="95" fill="url(#brandGrad)" stroke="#ffffff" stroke-width="10" />
    <!-- RD$ / Dollar symbol in coin -->
    <path d="M340 270 v120 M315 305 c0-15 45-15 45 0 c0 30-50 15-50 45 c0 15 45 15 45 0" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>